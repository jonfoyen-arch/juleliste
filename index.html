<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Juleønsker for familien Føyen">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ønskeliste for familien Føyen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Playball&display=swap">
<style>
/* Layout: juleplakat med himmelbånd og treskilt øverst, pergamentkort i to rader, snø og gaver nederst. Ett fast utseende, uavhengig av lyst/mørkt tema. */
:root {
  color-scheme: light;
  --natt: #2b3a50;
  --skumring: #6f8aa8;
  --is: #c7d6e4;
  --sno: #f7f9fc;
  --pergament: #fbeedc;
  --pergament-lys: #fdf5e8;
  --kant: #d2b38a;
  --blekk: #2a211a;
  --rod: #a8141c;
  --rod-mork: #7e0d13;
  --bandtekst: #fff6ea;
  --gran: #1d5c33;
  --skygge: rgb(24 34 52 / .32);
  --skrift-navn: "Playball", "Brush Script MT", "Segoe Script", cursive;
  --skrift-tekst: "Alegreya", Georgia, "Times New Roman", serif;
}
body {
  background: linear-gradient(180deg, var(--natt) 0, var(--skumring) 300px, var(--is) 720px, var(--sno) 100%);
  color: var(--blekk);
  font-family: var(--skrift-tekst);
  font-size: 18px;
  line-height: 1.32;
  overflow-x: hidden;
}
#sno { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.topp, .side, .fot { position: relative; z-index: 1; }

.topp { display: flex; justify-content: center; padding-block: 14px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.himmel {
  position: absolute; inset: 0 0 auto 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center top;
  -webkit-mask-image: linear-gradient(180deg, #000 58%, transparent);
  mask-image: linear-gradient(180deg, #000 58%, transparent);
}
.topp h1 { position: relative; margin: 0; width: min(640px, 100%); line-height: 0; filter: drop-shadow(0 8px 12px var(--skygge)); }
.topp h1 img { width: 100%; height: auto; }

.side { padding-block: 34px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rutenett { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 40px 26px; max-width: 1260px; margin-inline: auto; }
.kort { grid-column: span 2; position: relative; min-width: 0; filter: drop-shadow(0 6px 12px var(--skygge)); }
.kort:nth-child(-n+2) { grid-column: span 3; }
.flate {
  --r: 16px;
  height: 100%;
  background: linear-gradient(170deg, var(--pergament-lys), var(--pergament) 45%);
  -webkit-mask:
    radial-gradient(circle var(--r) at 0 0, transparent 98%, #000) top left / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 100% 0, transparent 98%, #000) top right / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 0 100%, transparent 98%, #000) bottom left / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 100% 100%, transparent 98%, #000) bottom right / 51% 51% no-repeat;
  mask:
    radial-gradient(circle var(--r) at 0 0, transparent 98%, #000) top left / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 100% 0, transparent 98%, #000) top right / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 0 100%, transparent 98%, #000) bottom left / 51% 51% no-repeat,
    radial-gradient(circle var(--r) at 100% 100%, transparent 98%, #000) bottom right / 51% 51% no-repeat;
}
.innhold { display: grid; grid-template-columns: minmax(0, 1fr) var(--bildebredde, 240px); gap: 16px 18px; align-items: start; padding: 62px 22px 24px 24px; }
.innhold.uten-bilder, .innhold.bilder-under { grid-template-columns: minmax(0, 1fr); }

.navn { position: absolute; top: -14px; left: -8px; z-index: 2; display: flex; align-items: center; gap: 12px; margin: 0; font-weight: 400; }
.band {
  display: block; padding: 2px 44px 7px 26px;
  background: linear-gradient(180deg, var(--rod) 0%, var(--rod-mork) 100%);
  color: var(--bandtekst);
  font-family: var(--skrift-navn); font-size: 34px; line-height: 1.2; white-space: nowrap;
  clip-path: polygon(0 6%, 100% 0, calc(100% - 20px) 50%, 100% 100%, 0 94%, 12px 50%);
  transform: rotate(-1.6deg);
}
.hjerte { width: 26px; height: 26px; flex: none; margin-top: 6px; }
.hjerte path { fill: none; stroke: var(--rod); stroke-width: 2; stroke-linejoin: round; }

ul { margin: 0; padding: 0 0 0 1.05em; display: flex; flex-direction: column; gap: 4px; }
li { min-width: 0; overflow-wrap: anywhere; }
li::marker { color: var(--rod); }
.lenker { list-style: disc; margin-top: 3px; padding-left: 1.05em; gap: 2px; }
.lenker li::marker { color: var(--gran); }
a { color: var(--gran); text-decoration-thickness: 1px; text-underline-offset: 2px; font-weight: 500; }
a:hover { color: var(--rod); }
a:focus-visible { outline: 2px solid var(--rod); outline-offset: 2px; border-radius: 2px; }

.bilder { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; min-width: 0; align-self: center; }
.bilder img { width: var(--b, 100%); height: auto; display: block; }
.bilder-under .bilder { flex-wrap: nowrap; align-items: flex-end; }
/* Hvit produktbakgrunn smelter inn i pergamentet */
.bilderrad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; align-items: center; justify-items: center; padding: 0 22px 24px 24px; margin-top: -8px; }
.bilderrad img { width: 100%; max-width: 150px; height: auto; max-height: 132px; object-fit: contain; display: block; mix-blend-mode: multiply; }

.oppdatert { margin: 34px 0 0; text-align: center; font-size: 16px; font-style: italic; color: var(--blekk); }
.fot { padding-block: 0; margin-top: -8px; }
.scene { position: relative; display: flex; align-items: flex-end; justify-content: space-between; }
.drive { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 58%; max-width: none; }
.drive path { fill: var(--sno); }
.scene img { position: relative; height: auto; display: block; }
.venstre { position: relative; display: flex; align-items: flex-end; gap: 4px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-bottom: 8px; }
.lykt { width: clamp(62px, 7vw, 96px); }
.nisse { width: clamp(58px, 6.4vw, 90px); }
.gaver { width: clamp(250px, 44vw, 640px); }

@media (max-width: 1040px) {
  .rutenett { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kort, .kort:nth-child(-n+2) { grid-column: span 1; }
  .kort:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .innhold { grid-template-columns: minmax(0, 1fr); }
  .bilder { flex-wrap: nowrap; align-items: flex-end; max-width: 300px; width: 100%; margin-inline: auto; }
  .bilder img { width: auto; min-width: 0; max-width: 58%; max-height: 200px; }
  .bilder img:only-child { width: 100%; max-width: 250px; max-height: none; }
}
@media (max-width: 660px) {
  body { font-size: 17.5px; }
  .rutenett { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .kort:last-child:nth-child(odd) { grid-column: auto; }
  .innhold { padding: 58px 18px 20px 20px; }
  .navn { left: -4px; }
  .band { font-size: 31px; }
  .bilderrad { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 18px 20px 20px; }
}
</style>

</head>

<canvas id="sno" aria-hidden="true"></canvas>

<header class="topp">

<div class="side">

  <div class="scene" aria-hidden="true">

<script>
(function () {
  var data = JSON.parse(document.getElementById("onsker").textContent);
  var bilder_data = JSON.parse(document.getElementById("bilder").textContent);
  document.querySelectorAll("img[data-bilde]").forEach(function (i) { i.src = bilder_data[i.getAttribute("data-bilde")]; });
  var HJERTE = '<svg class="hjerte" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C7 16.6 2.5 13 2.5 8.4 2.5 5.4 4.8 3.2 7.5 3.2c1.9 0 3.5 1.1 4.5 3 1-1.9 2.6-3 4.5-3 2.7 0 5 2.2 5 5.2 0 4.6-4.5 8.2-9.5 12.6z"/></svg>';

  function el(tag, cls, tekst) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (tekst != null) e.textContent = tekst;
    return e;
  }

  function onskeRad(o) {
    var li = el("li");
    if (typeof o === "string") { li.textContent = o; return li; }
    li.append(document.createTextNode(o.tekst));
    if (o.lenker && o.lenker.length) {
      var ul = el("ul", "lenker");
      o.lenker.forEach(function (l) {
        var r = el("li"), a = el("a", "", l.tekst);
        a.href = l.url; a.target = "_blank"; a.rel = "noopener";
        r.append(a); ul.append(r);
      });
      li.append(ul);
    }
    return li;
  }

  function kort(p) {
    var bilder = p.bilder || [];
    var s = el("section", "kort");
    var h = el("h2", "navn");
    h.append(el("span", "band", p.navn));
    h.insertAdjacentHTML("beforeend", HJERTE);
    var flate = el("div", "flate");
    var inn = el("div", "innhold");
    if (!bilder.length) inn.classList.add("uten-bilder");
    if (p.bildeplass === "under") inn.classList.add("bilder-under");
    if (p.bildebredde) inn.style.setProperty("--bildebredde", p.bildebredde + "px");
    var ul = el("ul");
    (p.onsker || []).forEach(function (o) { ul.append(onskeRad(o)); });
    inn.append(ul);
    if (bilder.length) {
      var b = el("div", "bilder");
      bilder.forEach(function (i) {
        var img = el("img");
        img.src = bilder_data[i.fil] || i.fil; img.alt = i.alt || "";
        if (i.bredde) img.style.setProperty("--b", i.bredde);
        b.append(img);
      });
      inn.append(b);
    }
    flate.append(inn);
    if (p.bilderrad && p.bilderrad.length) {
      var rad = el("div", "bilderrad");
      p.bilderrad.forEach(function (i) {
        var img = el("img");
        img.src = bilder_data[i.fil] || i.fil; img.alt = i.alt || "";
        rad.append(img);
      });
      flate.append(rad);
    }
    s.append(h, flate);
    return s;
  }

  var rot = document.getElementById("rutenett");
  data.personer.forEach(function (p) { rot.append(kort(p)); });
  document.getElementById("oppdatert").textContent = "Sist oppdatert " + data.oppdatert;

  /* Snø bak kortene. Står stille ved redusert bevegelse. */
  var c = document.getElementById("sno"), g = c.getContext("2d");
  if (!g) return;
  var stille = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var w = 0, h = 0, f = [];
  function str() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * d; c.height = h * d;
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  function tegn() {
    g.clearRect(0, 0, w, h);
    g.fillStyle = "rgba(255,255,255,.85)";
    f.forEach(function (s) {
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.3); g.fill();
    });
  }
  function steg() {
    f.forEach(function (s) {
      s.y += s.v; s.x += Math.sin(s.y / 46 + s.p) * .35;
      if (s.y > h + 4) { s.y = -4; s.x = Math.random() * w; }
    });
    tegn();
    requestAnimationFrame(steg);
  }
  str();
  for (var i = 0; i < 70; i++) f.push({ x: Math.random() * w, y: Math.random() * h, r: 1 + Math.random() * 2.2, v: .25 + Math.random() * .6, p: Math.random() * 6 });
  window.addEventListener("resize", function () { str(); tegn(); });
  tegn();
  if (!stille) requestAnimationFrame(steg);
})();
</script>
